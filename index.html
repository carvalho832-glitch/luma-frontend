<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Luma • Jornada Saudável</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />

  <meta name="theme-color" content="#9333ea" />

  <meta
    name="mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css" />

</head>

<body
  id="app-body"
  class="bg-gray-100 flex justify-center items-center min-h-screen"
>

  <div
    id="app-shell"
    class="bg-white w-[375px] h-[712px] rounded-[40px] shadow-2xl overflow-hidden flex flex-col relative border-8 border-gray-800"
  >

    <!-- HEADER -->

    <div
      id="app-header"
      class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white pt-8 pb-4 px-6 rounded-b-[30px] shadow-md flex justify-between items-center z-10"
    >

      <div>

        <h1
          id="header-title"
          class="text-xl font-bold tracking-wide"
        >
          Sua Jornada
        </h1>

        <p
          id="header-subtitle"
          class="text-xs text-purple-200"
        >
          Estou aqui com você 💜
        </p>

      </div>

      <button
        id="open-settings-btn"
        class="w-9 h-9 rounded-full bg-white/20 flex justify-center items-center text-white/90"
      >

        <i
          id="settings-icon"
          class="fa-solid fa-gear text-lg"
        ></i>

      </button>

    </div>

    <!-- CONTEÚDO -->

    <div
      id="app-content"
      class="flex-1 relative overflow-hidden bg-slate-50"
    >

      <!-- CHAT -->

      <div
        id="view-chat"
        class="absolute inset-0 flex flex-col"
      >

        <div
          class="bg-white px-4 py-2 border-b border-slate-100 flex items-center justify-between"
        >

          <span
            class="text-[10px] font-black text-slate-400 uppercase"
          >
            Como está a mente?
          </span>

          <div class="flex gap-1.5">

            <button
              class="mood-btn"
              data-mood="Feliz"
            >
              😊
            </button>

            <button
              class="mood-btn"
              data-mood="Ansioso"
            >
              😰
            </button>

            <button
              class="mood-btn"
              data-mood="Cansado"
            >
              😴
            </button>

            <button
              class="mood-btn"
              data-mood="Estressado"
            >
              🤯
            </button>

          </div>

        </div>

        <div
          id="chat-box"
          class="flex-1 overflow-y-auto p-4 space-y-4 pb-36"
        >

          <div
            class="bg-white p-3 rounded-2xl shadow text-sm text-gray-700 w-[85%] border border-gray-100"
          >
            Olá 💜  
            Eu sou a Luma. Estou aqui para acompanhar sua jornada.
          </div>

          <div
            id="typing-indicator"
            class="hidden bg-gray-200 py-2 w-16 rounded-2xl text-center text-gray-500 text-xs"
          >
            ...
          </div>

        </div>

        <!-- INPUT -->

        <div
          class="absolute bottom-20 left-3 right-3 flex items-center bg-white rounded-full shadow-lg border border-gray-100 px-3 py-2 z-10 gap-2"
        >

          <input
            id="user-input"
            type="text"
            placeholder="Converse com a Luma..."
            class="flex-1 bg-transparent outline-none text-gray-700 text-sm"
          />

          <button
            id="send-btn"
            class="bg-purple-600 text-white w-9 h-9 rounded-full flex justify-center items-center"
          >

            <i
              class="fa-solid fa-paper-plane text-xs"
            ></i>

          </button>

        </div>

      </div>

      <!-- DIÁRIO -->

      <div
        id="view-diary"
        class="absolute inset-0 hidden p-5 overflow-y-auto pb-24"
      >

        <div
          class="bg-white p-4 rounded-2xl shadow mb-6 flex justify-between items-center"
        >

          <div class="text-center flex-1 border-r border-gray-100">

            <span
              class="text-xs text-gray-400 block uppercase font-semibold"
            >
              Consumido
            </span>

            <span
              id="cal-consumed"
              class="text-2xl font-black text-purple-600"
            >
              0
            </span>

            <span class="text-[10px] text-gray-400">
              kcal
            </span>

          </div>

          <div class="text-center flex-1">

            <span
              class="text-xs text-gray-400 block uppercase font-semibold"
            >
              Água
            </span>

            <span
              id="water-count"
              class="text-lg font-bold text-blue-500 block"
            >
              0 ml
            </span>

          </div>

        </div>

      </div>

      <!-- EVOLUÇÃO -->

      <div
        id="view-evolucao"
        class="absolute inset-0 hidden p-5 overflow-y-auto pb-24"
      >

        <div
          class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100"
        >

          <h3
            class="text-xs font-black text-purple-600 uppercase mb-3"
          >
            Evolução de Peso
          </h3>

          <canvas id="weightChart"></canvas>

        </div>

      </div>

      <!-- AJUSTES -->

      <div
        id="view-settings"
        class="absolute inset-0 hidden p-5 overflow-y-auto pb-24 bg-slate-50"
      >

        <div
          class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3"
        >

          <h3
            class="text-xs font-black text-purple-600 uppercase"
          >
            Ajustes do App
          </h3>

          <input
            id="cfg-user-name"
            type="text"
            placeholder="Seu nome"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold outline-none"
          />

          <button
            id="save-settings-btn"
            class="w-full bg-purple-600 text-white font-bold text-xs py-3 rounded-xl uppercase"
          >
            Salvar
          </button>

        </div>

      </div>

    </div>

    <!-- MENU -->

    <div
      class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 h-16 flex justify-around items-center px-4 pb-2 z-30"
    >

      <button
        id="nav-apoio"
        class="nav-item flex flex-col items-center text-purple-600 text-[10px] font-bold"
      >

        <i class="fa-solid fa-heart text-lg"></i>

        <span>Apoio</span>

      </button>

      <button
        id="nav-diario"
        class="nav-item flex flex-col items-center text-gray-400 text-[10px] font-bold"
      >

        <i class="fa-solid fa-book-open text-lg"></i>

        <span>Diário</span>

      </button>

      <button
        id="nav-evolucao"
        class="nav-item flex flex-col items-center text-gray-400 text-[10px] font-bold"
      >

        <i class="fa-solid fa-chart-line text-lg"></i>

        <span>Evolução</span>

      </button>

    </div>

  </div>

  <!-- JS -->
  <script src="./script.js"></script>

  <!-- SERVICE WORKER -->
  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker.register(
          "./service-worker.js"
        );

      });

    }

  </script>

</body>
</html>
