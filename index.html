<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Luma IA</title>

  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100">

<div class="app-container">

  <header class="topbar">
    <div>
      <h1 id="header-title">Sua Jornada</h1>
      <p id="header-subtitle">Estou aqui com você 💜</p>
    </div>

    <button id="open-settings-btn">
      <i id="settings-icon" class="fa-solid fa-gear"></i>
    </button>
  </header>

  <main>

    <section id="view-chat">

      <div class="mood-container">
        <p>COMO ESTÁ A MENTE?</p>

        <div class="mood-buttons">
          <button class="mood-btn" data-mood="feliz">😊</button>
          <button class="mood-btn" data-mood="triste">😢</button>
          <button class="mood-btn" data-mood="cansado">😴</button>
          <button class="mood-btn" data-mood="ansioso">🤯</button>
        </div>
      </div>

      <div id="chat-box">

        <div class="ai-message">
          Olá💜 Eu sou a Luma. Estou aqui para acompanhar sua jornada.
        </div>

        <div id="typing-indicator" class="hidden">
          Luma digitando...
        </div>

      </div>

      <div class="input-area">
        <input
          type="text"
          id="user-input"
          placeholder="Converse com a Luma..."
        />

        <button id="send-btn">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>

    </section>

  </main>

  <nav class="bottom-nav">

    <button id="nav-apoio" class="active-nav">
      <i class="fa-solid fa-heart"></i>
      <span>Apoio</span>
    </button>

    <button id="nav-diario">
      <i class="fa-solid fa-book"></i>
      <span>Diário</span>
    </button>

    <button id="nav-evolucao">
      <i class="fa-solid fa-chart-line"></i>
      <span>Evolução</span>
    </button>

  </nav>

</div>

<script src="script.js"></script>

</body>
</html>
